<main class="login-page">
  <section class="login-panel">
    <p class="eyebrow">CABINET MEDICAL</p>
    <h1>Ouvrir une session</h1>
    <p class="intro">Accedez aux dossiers et au planning du cabinet.</p>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>Email <input type="email" formControlName="email" autocomplete="username"></label>
      <label>Mot de passe <input type="password" formControlName="motDePasse" autocomplete="current-password"></label>
      @if (error) { <p class="error">{{ error }}</p> }
      <button type="submit">Se connecter</button>
    </form>
  </section>
</main>
